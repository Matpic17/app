<script>
(function () {
  'use strict';
  var L = window.LOGIC;

  /* ---------- State ---------- */
  var S = {
    appName: window.APP_NAME || 'Programme Monitoring', tool: window.TOOL_NAME || 'TOM',
    user: { email: '', isLeader: false, leaderNames: [] }, refresh: null,
    programmes: [], leaders: [], recent: [], homeLeader: '', homeQuery: '',
    view: 'home', prog: null,
    f: { ogs: [], leader: '', supplier: '' },
    sel: { kpi: 'open', sub: '', type: '' },
    limit: 50, send: null
  };
  var app = document.getElementById('app');

  /* ---------- Helpers ---------- */
  function run(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      r[fn].apply(r, args);
    });
  }
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function fmt(d) {
    if (!d) return '—';
    var p = String(d).split('-');
    return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : d;
  }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
  function errMsg(e) { return (e && e.message) ? e.message : String(e); }
  var toastTimer;
  function toast(msg, kind, link) {
    var t = document.getElementById('toast');
    t.className = 'toast' + (kind === 'err' ? ' err' : '');
    t.innerHTML = esc(msg) + (link ? ' · <a href="' + esc(link.url) + '" target="_blank" rel="noopener" style="color:#fff;font-weight:700">' + esc(link.label) + '</a>' : '');
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, link ? 12000 : 4500);
  }
  function busy(on, label) {
    document.getElementById('busy-label').textContent = label || 'Loading…';
    document.getElementById('busy').hidden = !on;
  }
  function isMail(s) { return /^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/.test(String(s || '').trim()); }

  var I = {
    back: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg>',
    search: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A5B78" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    chev: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A5B78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>',
    down: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg>',
    ext: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M10 14 20 4"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>',
    wrench: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>',
    doc: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>',
    user: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
    info: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
    warn: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 21h20z"/><path d="M12 10v5M12 18h.01"/></svg>',
    x: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    lock: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4A5B78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
    send: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>',
    clock: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    ok: '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#0B4A85" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>',
    check: '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0B4A85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>'
  };

  function logoHtml() {
    return window.LOGO_SRC
      ? '<img class="logo-img" src="' + esc(window.LOGO_SRC) + '" alt="Logo">'
      : '<div class="logo">LOGO</div>';
  }

  function topbar(title) {
    var r = S.refresh;
    return '<div class="wrap topbar"><div class="brand">' + logoHtml() + esc(title || S.appName) + '</div>' +
      '<span class="meta">' + (r ? 'Extract of ' + esc(r.date) + ' · ' + esc(r.week) : 'No refresh yet') + '</span></div>';
  }

  /* ---------- Rendering ---------- */
  function render() {
    if (S.view === 'home') { app.innerHTML = homeView(); renderTiles(); }
    else if (S.view === 'prog') app.innerHTML = progView();
    else { app.innerHTML = sendView(); if (S.send && S.send.html) setPreview(S.send.html); }
  }

  /* ===== Home ===== */
  function homeProgrammes() {
    if (S.user.isLeader || !S.homeLeader) return S.programmes;
    var L0 = S.leaders.filter(function (x) { return x.name === S.homeLeader; })[0];
    if (!L0) return [];
    return S.programmes.filter(function (p) { return L0.progs[p.name]; })
      .map(function (p) { return { name: p.name, open: L0.progs[p.name] }; });
  }

  function homeView() {
    var u = S.user;
    var who = u.isLeader
      ? '<div class="whoami">' + I.user + 'Signed in as ' + esc(u.leaderNames.join(', ')) + ' · case leader</div>' +
        '<p>Only the programmes where you have open cases are listed, with your cases only.</p>'
      : '<p>Select a programme to see its open cases, the solutions awaiting a decision and the applied solutions still blocking.</p>';
    var leaderFld = (!u.isLeader && S.leaders.length)
      ? '<div><label for="home-leader">Case leader</label><select id="home-leader"><option value="">All case leaders</option>' +
        S.leaders.map(function (x) { return '<option value="' + esc(x.name) + '"' + (x.name === S.homeLeader ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('') +
        '</select></div>'
      : '';
    var unknown = '';
    var r = S.refresh;
    if (!u.isLeader && r && ((r.unknownStatus || []).length || (r.unknownTypes || []).length)) {
      var list = function (a) { return a.slice(0, 8).map(function (x) { return '<code>' + esc(x[0]) + '</code> (' + x[1] + ')'; }).join(', '); };
      unknown = '<div class="notice">' + I.warn + '<div><b>Unknown implementation codes at the last refresh.</b> The solutions concerned are counted as “Unclassified”. Add these values to Codes.gs.' +
        ((r.unknownStatus || []).length ? '<br>Status (CU): ' + list(r.unknownStatus) : '') +
        ((r.unknownTypes || []).length ? '<br>Type (CL): ' + list(r.unknownTypes) : '') + '</div></div>';
    }
    var available = homeProgrammes().map(function (p) { return p.name; });
    var recent = S.recent.filter(function (n) { return available.indexOf(n) !== -1; }).slice(0, 3);
    var recentHtml = recent.length ? '<section aria-labelledby="t-rec"><h2 id="t-rec" class="eyebrow" style="margin-bottom:12px">Recently viewed</h2><div class="grid3">' +
      recent.map(function (n) {
        return '<button type="button" class="tile" data-act="open-prog" data-name="' + esc(n) + '"><span style="display:flex;align-items:center;gap:10px;color:#4A5B78">' + I.clock +
          '<span class="mono" style="color:#00205B">' + esc(n) + '</span></span>' + I.chev + '</button>';
      }).join('') + '</div></section>' : '';
    var none = !S.programmes.length
      ? '<div class="empty">' + (u.isLeader ? 'You have no open case as case leader.' : 'No data yet. Run “Refresh data now” from the spreadsheet menu.') + '</div>' : '';
    return '<div class="top">' + topbar() + '<section class="hero"><div class="wrap">' + '<h1>Which programme do you want to review?</h1>' + who +
      '<div class="hero-row"><div style="flex:1;min-width:280px;max-width:640px"><label for="q">Search a programme</label><div class="search">' + I.search +
      '<input id="q" type="search" autocomplete="off" placeholder="Type a programme name" value="' + esc(S.homeQuery) + '"></div></div>' + leaderFld + '</div></div></section></div>' +
      '<main class="wrap stack">' + unknown + recentHtml + none +
      '<section aria-labelledby="t-all"><div class="row-between" style="margin-bottom:12px"><h2 id="t-all" class="eyebrow">' +
      (S.homeLeader ? 'Programmes of ' + esc(S.homeLeader) : u.isLeader ? 'Your programmes' : 'All programmes') + '</h2><span class="mut sm" id="count"></span></div>' +
      '<div class="grid4" id="tiles"></div></section></main>';
  }

  function renderTiles() {
    var tiles = document.getElementById('tiles');
    if (!tiles) return;
    var ql = S.homeQuery.trim().toLowerCase();
    var list = homeProgrammes().filter(function (p) { return p.name.toLowerCase().indexOf(ql) !== -1; });
    tiles.innerHTML = list.length ? list.map(function (p) {
      return '<button type="button" class="tile" data-act="open-prog" data-name="' + esc(p.name) + '"><span class="tile-col"><span class="mono">' + esc(p.name) + '</span>' +
        '<span class="mut sm">' + plural(p.open, 'open case') + '</span></span>' + I.chev + '</button>';
    }).join('') : (S.programmes.length ? '<div class="empty">No programme matches “' + esc(S.homeQuery) + '”</div>' : '');
    document.getElementById('count').textContent = plural(list.length, 'programme');
  }

  /* ===== Programme view ===== */
  function current() {
    return L.scope(S.prog, S.f, S.sel);
  }

  function progView() {
    var p = S.prog, sc = current();
    return '<div class="top">' + topbar() + progHeader(p, sc) + '</div>' +
      '<main class="wrap stack">' + filterBar(p, sc) +
      '<div id="kpis">' + kpiRow(p, sc) + '</div>' +
      '<div id="drill">' + drillPanel(sc) + '</div>' +
      '<section class="card" style="min-width:0" id="cases">' + caseList(p, sc) + '</section>' +
      legend() + '</main>';
  }

  function progHeader(p, sc) {
    var opts = (S.user.isLeader ? S.programmes.map(function (x) { return x.name; }) : S.programmes.map(function (x) { return x.name; }))
      .map(function (n) { return '<option value="' + esc(n) + '"' + (n === p.name ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('');
    return '<div class="wrap phead">' +
      '<button type="button" class="back" data-act="home">' + I.back + 'All programmes</button>' +
      '<div class="phead-row"><div style="display:flex;flex-direction:column;gap:6px">' +
      '<div class="eyebrow" style="color:#AFC3E6">Programme</div><h1>' + esc(p.name) + '</h1>' +
      (p.leaderView ? '<span class="leader-badge">' + I.user + 'Your cases as case leader</span>' : '') +
      '<div class="rate" id="rate">' + rateInner(sc) + '</div></div>' +
      '<div class="actions"><div class="select-wrap"><label for="switch">Switch programme</label><select id="switch">' + opts + '</select></div>' +
      '<button type="button" class="btn btn-ghost" data-act="export">' + I.down + 'Export to Sheets</button>' +
      '<button type="button" class="btn btn-white" data-act="send">' + I.doc + 'Send report</button></div></div></div>';
  }

  function rateInner(sc) {
    var k = sc.kpi;
    return '<span>Closure rate' + (L.filtersActive(S.f) ? ' (filtered)' : '') + '</span>' +
      '<span class="rate-bar" role="img" aria-label="' + k.rate + ' %"><span style="width:' + k.rate + '%"></span></span>' +
      '<b style="color:#fff">' + k.rate + ' %</b>' +
      '<span style="color:#C9D6EE">(' + k.closed + ' closed cases out of ' + k.total + ')</span>';
  }

  function options(list, cur, allLabel) {
    return '<option value="">' + allLabel + '</option>' + (list || []).map(function (v) {
      return '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(v) + '</option>';
    }).join('');
  }

  function filterBar(p, sc) {
    var f = p.filters || {};
    return '<section class="card filters-bar" aria-label="Filters">' +
      ((f.ogs || []).length ? '<fieldset class="og-set"><legend>OG</legend><div class="og-list">' + f.ogs.map(function (v) {
        return '<label class="og-chk"><input type="checkbox" name="f-og" value="' + esc(v) + '"' + (S.f.ogs.indexOf(v) !== -1 ? ' checked' : '') + '>' + esc(v) + '</label>';
      }).join('') + '</div></fieldset>' : '') +
      (S.user.isLeader ? '' : '<div class="fld"><label for="f-leader">Case leader</label><select id="f-leader">' + options(f.leaders, S.f.leader, 'All') + '</select></div>') +
      '<div class="fld"><label for="f-supplier">Supplier</label><select id="f-supplier">' + options(f.suppliers, S.f.supplier, 'All') + '</select></div>' +
      '<div id="filter-note" class="filter-note">' + filterNote(p, sc) + '</div></section>';
  }

  function filterNote(p, sc) {
    if (!L.filtersActive(S.f)) return '<span class="mut sm">Indicators and cases cover the whole programme' + (p.leaderView ? ' (your cases)' : '') + '.</span>';
    return '<span class="sm"><b>' + sc.kpi.open + '</b> of ' + p.dossiers.length + ' open cases match the filters: indicators recomputed.</span>' +
      '<button type="button" class="btn btn-link" data-act="clear-filters">Clear filters</button>';
  }

  /* Indicators */
  function hist(field, sub) {
    var h = (S.prog.history || []).filter(function (x) { return sub ? x.cats : (field === 'decision' ? x.decision != null : true); });
    return h.map(function (x) { return sub ? x.cats[sub] : x[field]; });
  }
  function spark(vals) {
    if (vals.length < 2 || L.filtersActive(S.f)) return '';
    var mx = Math.max.apply(null, vals), mn = Math.min.apply(null, vals), n = vals.length;
    var pts = vals.map(function (v, i) { return (i * 160 / (n - 1)).toFixed(1) + ',' + (4 + (mx - v) / ((mx - mn) || 1) * 32).toFixed(1); }).join(' ');
    return '<svg width="120" height="40" viewBox="-4 0 168 40" role="img" aria-label="Trend over ' + n + ' weeks"><polyline points="' + pts + '" fill="none" stroke="#0063B2" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  }
  function delta(vals) {
    if (vals.length < 2 || L.filtersActive(S.f)) return '';
    var d = vals[vals.length - 1] - vals[vals.length - 2];
    if (!d) return '<span>= vs last week</span>';
    return '<span class="' + (d < 0 ? 'delta-good' : 'delta-bad') + '">' + (d < 0 ? '▼ ' + (-d) : '▲ ' + d) + ' vs last week</span>';
  }

  function kpiRow(p, sc) {
    var k = sc.kpi;
    var card = function (id, num, foot, h) {
      var def = L.KPI[id];
      return '<button type="button" class="kpi" data-act="kpi" data-kpi="' + id + '" aria-pressed="' + (S.sel.kpi === id) + '">' +
        '<span class="lbl"><span>' + esc(def.title) + '</span>' + (id === 'open' ? '' : '<span class="drill">Details ›</span>') + '</span>' +
        '<span class="num-row"><span class="num">' + num + '<small>' + def.unit + '</small></span>' + spark(h) + '</span>' +
        '<span class="desc">' + esc(def.desc) + '</span>' +
        '<span class="foot">' + foot + delta(h) + '</span></button>';
    };
    return '<section class="kpis" aria-label="Indicators">' +
      card('open', k.open, '<span><b>' + k.nNew + '</b> new this week</span>', hist('open')) +
      card('decision', k.decision, '<span>' + k.proposed + ' proposed · ' + k.missing + ' missing</span>', hist('decision')) +
      card('applied', k.applied, '<span>' + k.cats.IMPL_CLOSED + ' data inconsistencies</span>' +
        (k.cats.UNCLASSIFIED ? '<span>' + k.cats.UNCLASSIFIED + ' unclassified</span>' : ''), hist('applied')) +
      '</section>';
  }

  /* Drill-down: sub-indicators, breadcrumb, breakdown by solution type */
  function drillPanel(sc) {
    var sel = S.sel;
    if (sel.kpi === 'open') return '';
    var k = sc.kpi;
    var subs = L.SUB[sel.kpi].filter(function (s) { return !(s.hideIfZero && !k.cats[s.id]); }).map(function (s) {
      var n = k.cats[s.id] || 0;
      return '<button type="button" class="sub' + (s.alert && n ? ' sub-alert' : '') + '" data-act="sub" data-sub="' + s.id + '" aria-pressed="' + (sel.sub === s.id) + '">' +
        '<span class="t"><span class="dot c-' + s.id + '"></span>' + esc(s.title) + '</span>' +
        '<span class="n">' + n + '</span><span class="d">' + esc(s.desc) + '</span>' + subDelta(s.id) + '</button>';
    }).join('');
    var bd = L.breakdown(sc.filtered, sel);
    var max = bd.reduce(function (m, b) { return Math.max(m, b.count); }, 0) || 1;
    var bdTitle = sel.sub === 'MISSING' ? 'By group' : 'By solution type';
    var bdHtml = bd.length ? '<div class="bd" role="group" aria-label="' + bdTitle + '">' + bd.map(function (b) {
      return '<button type="button" class="bd-row" data-act="type" data-type="' + esc(b.key) + '" aria-pressed="' + (sel.type === b.key) + '">' +
        '<span class="l" title="' + esc(b.label) + '">' + esc(b.label) + '</span>' +
        '<span class="bd-track"><span style="width:' + Math.max(2, Math.round(b.count / max * 100)) + '%"></span></span>' +
        '<span class="c"><b>' + b.count + '</b> · ' + plural(b.cases, 'case') + '</span></button>';
    }).join('') + '</div>' : '<p class="mut" style="margin:0">Nothing in this category.</p>';
    return '<section class="card drill-panel" aria-label="Details">' + crumbs() +
      '<div class="subs">' + subs + '</div>' +
      '<div style="display:flex;flex-direction:column;gap:8px"><h3 class="eyebrow">' + bdTitle + ' <span style="text-transform:none;letter-spacing:0;font-weight:400">· click a line to filter the cases</span></h3>' + bdHtml + '</div></section>';
  }

  function subDelta(id) {
    var v = hist(null, id);
    if (v.length < 2 || L.filtersActive(S.f)) return '';
    var d = v[v.length - 1] - v[v.length - 2];
    return '<span class="d">' + (d ? (d < 0 ? '▼ ' + (-d) : '▲ ' + d) + ' vs last week' : '= vs last week') + '</span>';
  }

  function crumbs() {
    var sel = S.sel, parts = ['<button type="button" data-act="crumb" data-level="0">All open cases</button>'];
    var cur = function (t) { return '<span class="cur">' + esc(t) + '</span>'; };
    var sep = '<span class="sep">›</span>';
    var title = L.KPI[sel.kpi].title;
    parts.push(sel.sub || sel.type ? '<button type="button" data-act="crumb" data-level="1">' + esc(title) + '</button>' : cur(title));
    if (sel.sub) parts.push(sel.type ? '<button type="button" data-act="crumb" data-level="2">' + esc(L.CAT_TITLE[sel.sub]) + '</button>' : cur(L.CAT_TITLE[sel.sub]));
    if (sel.type) parts.push(cur(L.keyLabel(sel.type)));
    return '<nav class="crumbs" aria-label="Selection">' + parts.join(sep) + '</nav>';
  }

  /* Case list */
  function caseList(p, sc) {
    var list = sc.selected;
    var head = '<div class="ahead"><div><h2>' + esc(L.selectionLabel(S.sel)) + '</h2><div class="mut sm">' +
      plural(list.length, 'case') + (S.sel.kpi === 'open' ? ' where the programme is still open' : ' concerned') +
      (L.filtersActive(S.f) ? ' · ' + esc(L.filterLabel(S.f)) : '') + '</div></div></div>';
    if (!p.dossiers.length) {
      return head + '<div class="blank">' + I.check + '<div class="cond">No open case for this programme</div><div class="mut">All its applied solutions are closed in this week’s extract.</div></div>';
    }
    if (!list.length) return head + '<div class="blank"><div class="cond">No case in this selection</div><div class="mut">Change the filters or pick another indicator.</div></div>';
    var shown = list.slice(0, S.limit);
    var more = list.length > shown.length
      ? '<div class="more"><span>' + shown.length + ' of ' + list.length + ' cases shown</span><button type="button" class="btn" data-act="more">Show more</button></div>'
      : '<div class="more"><span>' + plural(list.length, 'case') + ' · sorted by number of items in the selection</span></div>';
    return head + '<div class="thead cols-d"><span>Case</span><span>Groups, solutions and implementations</span><span>' + esc(S.tool) + '</span></div>' +
      shown.map(caseRow).join('') + more;
  }

  function caseRow(d) {
    var v = L.annotate(d, S.sel);
    var pct = d.solTotal ? Math.round(d.solDone / d.solTotal * 100) : 0;
    var info = [
      d.leader ? '<span><span class="k">Case leader</span> ' + esc(d.leader) + '</span>' : '',
      d.supplier ? '<span><span class="k">Supplier</span> ' + esc(d.supplier) + '</span>' : ''
    ].join('');
    return '<article class="drow-wrap"><div class="drow cols-d">' +
      '<div style="display:flex;flex-direction:column;gap:6px">' +
      '<div class="idline"><span class="mono">' + esc(d.id) + '</span>' + (d.isNew ? '<span class="badge-new">New</span>' : '') + '</div>' +
      '<div class="idline">' + (d.og ? '<span class="tag">' + esc(d.og) + '</span>' : '') + (d.status ? '<span class="tag tag-soft">' + esc(d.status) + '</span>' : '') + '</div>' +
      (info ? '<div class="dinfo">' + info + '</div>' : '') +
      '<div class="mut sm">' + d.solDone + ' / ' + d.solTotal + ' applied solutions closed</div><div class="bar"><span style="width:' + pct + '%"></span></div></div>' +
      '<div class="groups">' + v.groups.map(groupCard).join('') + '</div>' +
      '<div><a class="btn" href="' + esc(d.url) + '" target="_blank" rel="noopener" aria-label="Open case ' + esc(d.id) + ' in ' + esc(S.tool) + '">Open ' + I.ext + '</a></div>' +
      '</div></article>';
  }

  function groupCard(g) {
    var dim = !g.main.length;
    var counts = countsLabel(g.main.concat(g.other));
    var body = g.main.map(itemBlock).join('');
    if (g.noApplied && !g.missing && g.main.some(function (it) { return it.kind === 'proposal'; })) {
      body = '<div class="noapplied">No applied solution in this group</div>' + body;
    }
    var others = g.other.length ? '<div class="others"><span class="xs-lbl">' + (dim ? '' : 'Also in this group') + '</span>' + g.other.map(miniItem).join('') + '</div>' : '';
    return '<div class="grp' + (dim ? ' grp-dim' : '') + '"><div class="grp-head"><span class="grp-name">' + esc(g.name) + '</span>' +
      (counts ? '<span class="mut sm">' + counts + '</span>' : '') + '</div>' + body + others + '</div>';
  }

  function countsLabel(items) {
    var c = { blocking: 0, proposal: 0, closed: 0 };
    items.forEach(function (it) { if (c[it.kind] != null) c[it.kind]++; });
    return [c.blocking ? c.blocking + ' blocking' : '', c.proposal ? c.proposal + ' proposed' : '', c.closed ? c.closed + ' closed' : '']
      .filter(Boolean).join(' · ');
  }

  function catBadge(cat) {
    return cat && L.CAT_TITLE[cat] ? '<span class="badge b-' + cat + '">' + (cat === 'IMPL_CLOSED' ? 'Data inconsistency · ' : '') + esc(L.CAT_TITLE[cat]) + '</span>' : '';
  }

  function implRows(impls) {
    return '<div class="impls">' + impls.map(function (im) {
      var flag = im.open === 'Oui' ? '<span class="flag f-open">Open</span>' : im.open === 'Non' ? '<span class="flag f-closed">Closed</span>' : '<span class="flag f-unknown">Unknown status</span>';
      var kind = im.manual === 'Oui' ? 'manual' : im.manual === 'Non' ? 'in ' + S.tool : (im.open === 'Non' ? '' : 'unknown type');
      var meta = [im.label, im.resp ? 'ref. ' + im.resp : '', im.status ? 'status: ' + im.status : '', kind].filter(Boolean).join(' · ');
      return '<div class="impl-row"><span class="impl' + (im.open === 'Non' ? ' impl-closed' : '') + '">' + I.wrench + esc(im.code || 'Implementation') + '</span>' + flag +
        '<span class="info">' + esc(meta) + '</span></div>';
    }).join('') + '</div>';
  }

  function solTitle(s) {
    return '<span class="sol-name">' + esc(s.name || s.type || 'Solution') + '</span>' +
      (s.name && s.type ? '<span class="mut sm">' + esc(s.type) + '</span>' : '');
  }

  function itemBlock(it) {
    var s = it.sol;
    if (it.kind === 'missing') return '<div class="missing">This group has no solution: neither applied nor proposed</div>';
    if (it.kind === 'proposal') {
      return '<div class="prop"><div class="prop-head">' + I.info + '<b>Proposed</b>' + solTitle(s) +
        '<span class="mut sm">' + (s.origin === 'Groupe' ? 'group solution' : 'programme solution') + '</span></div>' +
        (s.impls.length ? implRows(s.impls) : '<span class="mut sm">No implementation yet</span>') + '</div>';
    }
    var origin = s.origin === 'Groupe' ? '<span class="badge-grp">Group solution</span>' : '<span class="badge-prg">Programme solution</span>';
    return '<div class="sol"><div class="sol-head">' + solTitle(s) + '<span class="pill-st">' + esc(s.status || '—') + '</span>' + origin + catBadge(it.cat) + '</div>' +
      (s.impls.length ? '<span class="xs-lbl">Implementations</span>' + implRows(s.impls) : '<span class="mut sm">No implementation linked</span>') + '</div>';
  }

  function miniItem(it) {
    var s = it.sol;
    if (it.kind === 'missing') return '<span class="mini mini-missing">No solution</span>';
    var name = esc(s.name || s.type || 'Solution');
    if (it.kind === 'closed') return '<span class="mini mini-closed">' + name + ' <b>' + esc(s.status) + '</b></span>';
    if (it.kind === 'proposal') return '<span class="mini mini-prop">Proposed: ' + name + '</span>';
    return '<span class="mini">' + name + ' · ' + esc(s.status) + ' · ' + esc(L.CAT_TITLE[it.cat] || '') + '</span>';
  }

  function legend() {
    return '<section class="legend"><span><span class="pill-st">4/6</span> solution status (the reference)</span>' +
      '<span><span class="impl" style="font-size:12px">CODE</span> implementation type (CL) · status (CU) open or closed</span>' +
      '<span>Closed if X/Y with X = Y, or ≥ 7/9 · no applied solution = open · the programme solution prevails over the group solution</span></section>';
  }

  function refreshProgramme() {
    var p = S.prog, sc = current();
    document.getElementById('kpis').innerHTML = kpiRow(p, sc);
    document.getElementById('drill').innerHTML = drillPanel(sc);
    document.getElementById('cases').innerHTML = caseList(p, sc);
    var r = document.getElementById('rate'); if (r) r.innerHTML = rateInner(sc);
    var n = document.getElementById('filter-note'); if (n) n.innerHTML = filterNote(p, sc);
  }

  /* ===== Send report ===== */
  function sendCounts() {
    var sc = current(), items = 0;
    sc.selected.forEach(function (d) { items += L.annotate(d, S.sel).nMain; });
    return { cases: sc.selected.length, items: items };
  }

  function scopeText() {
    var fl = L.filterLabel(S.f);
    return L.selectionLabel(S.sel) + (fl ? ' · ' + fl : '');
  }

  function sendView() {
    var p = S.prog, s = S.send;
    var head = '<div class="top"><div class="wrap topbar"><div class="brand">' + logoHtml() + 'Send the report · <span class="mono" style="letter-spacing:0;text-transform:none;color:#fff;font-size:16px">' + esc(p.name) + '</span></div>' +
      '<button type="button" class="btn btn-ghost" data-act="back-prog">' + I.back + 'Back to the programme</button></div></div>';
    var left = '<div class="preview"><div style="align-self:stretch"><span class="eyebrow">PDF preview</span></div>' +
      '<div class="frame"><iframe id="preview" title="Report preview" sandbox=""></iframe></div>' +
      '<span class="mut sm">Scroll inside the preview to see the whole report.</span></div>';
    var right = s.result ? sentView(s.result) : sendForm(p, s);
    return head + '<div class="send">' + left + '<div class="form card" style="border-radius:0;border:0">' + right + '</div></div>';
  }

  function sendForm(p, s) {
    var c = sendCounts();
    var hint = (p.lastTo && p.lastTo.length) ? '<div class="hint">' + I.clock + 'Pre-filled with the last recipient of ' + esc(p.name) + '</div>' : '';
    return '<div class="form-body">' +
      recipField('to', 'To · owner and recipients', 'Name or e-mail address…') + hint +
      recipField('cc', 'Cc', 'Add someone in copy…') +
      '<div class="fld"><label for="subj">Subject</label><input id="subj" type="text" maxlength="250" value="' + esc(s.subject) + '"></div>' +
      '<div class="fld"><label for="body">Message</label><textarea id="body" rows="8" maxlength="10000">' + esc(s.bodyTouched ? s.body : defaultBody()) + '</textarea></div>' +
      '<div class="send-scope"><span class="xs-lbl">Report content: exactly what is on screen</span>' +
      '<span class="sm"><b>' + esc(scopeText()) + '</b></span><span class="sm">' + plural(c.cases, 'case') + ' · ' + plural(c.items, 'item') + '</span>' +
      (c.cases ? '' : '<span class="sm" style="color:#9A3412;font-weight:600">Nothing to send in this selection: go back and change it.</span>') + '</div>' +
      '<div class="attach"><span class="pdf">PDF</span><span style="display:flex;flex-direction:column"><span class="mono strong" style="font-size:14px">' + esc(p.name) + '_status_' + today() + '.pdf</span><span class="mut sm">Generated when sending · clickable ' + esc(S.tool) + ' links</span></span></div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:4px 24px"><label class="chk"><input type="checkbox" id="opt-drive"' + (s.saveDrive ? ' checked' : '') + '> Save a copy in the reports Drive folder</label>' +
      '<label class="chk"><input type="checkbox" id="opt-log"' + (s.log ? ' checked' : '') + '> Log the e-mail</label></div>' +
      '</div><div class="form-foot"><button type="button" class="btn" data-act="back-prog" style="border-color:transparent">Cancel</button>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn" data-act="pdf-drive">' + I.down + 'Open the PDF</button>' +
      '<button type="button" class="btn btn-primary" data-act="do-send" id="do-send"' + (s.to.length && c.cases ? '' : ' disabled') + '>' + I.send + 'Send with Gmail</button></div></div>';
  }

  function recipField(field, label, ph) {
    return '<div class="fld recip"><label for="in-' + field + '">' + label + '</label>' +
      '<div class="recip-box"><span id="chips-' + field + '" style="display:contents">' + chipsHtml(field) + '</span>' +
      '<input id="in-' + field + '" data-recip="' + field + '" type="text" autocomplete="off" placeholder="' + ph + '" aria-autocomplete="list" aria-controls="sugg-' + field + '"></div>' +
      '<div class="sugg" id="sugg-' + field + '" role="listbox" hidden></div></div>';
  }

  function chipsHtml(field) {
    var s = S.send, html = '';
    if (field === 'cc') {
      html += '<span class="person person-locked" title="You are always in copy">' + I.lock + '<span class="who"><b>You</b><span>' + esc(S.user.email) + '</span></span></span>';
    }
    return html + s[field].map(function (c) {
      return '<span class="person"><span class="who"><b>' + esc(c.name || c.email) + '</b><span>' + esc(c.email) + '</span></span>' +
        '<button type="button" class="x" data-act="rm" data-field="' + field + '" data-email="' + esc(c.email) + '" aria-label="Remove ' + esc(c.name || c.email) + '">' + I.x + '</button></span>';
    }).join('');
  }

  function renderRecip(field) {
    var el = document.getElementById('chips-' + field);
    if (el) el.innerHTML = chipsHtml(field);
    var btn = document.getElementById('do-send');
    if (btn) btn.disabled = !S.send.to.length || !sendCounts().cases;
    if (field === 'to' && !S.send.bodyTouched) {
      var b = document.getElementById('body');
      if (b) b.value = defaultBody();
    }
  }

  function renderSugg(field) {
    var box = document.getElementById('sugg-' + field);
    if (!box) return;
    var list = S.send.sugg[field] || [];
    box.hidden = !list.length;
    box.innerHTML = list.map(function (pp, i) {
      return '<button type="button" role="option" data-act="add" data-field="' + field + '" data-idx="' + i + '">' +
        '<span style="display:flex;flex-direction:column"><span class="n">' + esc(pp.name || pp.email) + '</span><span class="e">' + esc(pp.email) + '</span></span>' +
        '<span class="e">' + esc(pp.title || '') + '</span></button>';
    }).join('') + (list.length ? '<div class="mut" style="padding:6px 10px 2px;font-size:12px">Results from the company directory</div>' : '');
  }

  function defaultBody() {
    var p = S.prog, s = S.send, first = '';
    if (s && s.to[0] && s.to[0].name && s.to[0].name.indexOf('@') === -1) first = ' ' + s.to[0].name.split(' ')[0];
    var c = sendCounts();
    return 'Hello' + first + ',\n\n' +
      'Please find attached the status of programme ' + p.name + ' as of ' + fmt(today()) + ':\n' +
      scopeText() + ' — ' + plural(c.cases, 'case') + ', ' + plural(c.items, 'item') + '.\n\n' +
      'Each case opens directly in ' + S.tool + ' from the PDF.\n\nBest regards,';
  }

  function sentView(r) {
    return '<div class="done"><div class="ok">' + I.ok + '</div><h2>Report sent</h2>' +
      '<p style="margin:0;font-size:16px;max-width:480px">Sent to <b>' + esc(r.to.join(', ')) + '</b>' + (r.cc.length ? ', copy to ' + esc(r.cc.join(', ')) : '') + '.</p>' +
      (r.link ? '<p class="mut" style="margin:0">A copy of the PDF is saved in the reports Drive folder · <a href="' + esc(r.link) + '" target="_blank" rel="noopener">open</a></p>' : '') +
      '<div style="display:flex;gap:10px;margin-top:8px"><button type="button" class="btn" data-act="new-send">New e-mail</button>' +
      '<button type="button" class="btn btn-primary" data-act="back-prog">Back to the programme</button></div></div>';
  }

  function setPreview(html) {
    var f = document.getElementById('preview');
    if (f) f.srcdoc = html;
  }

  /* ---------- Actions ---------- */
  function loadHome() {
    busy(true);
    return run('apiHome').then(function (h) {
      S.appName = h.appName || S.appName; S.user = h.user; S.refresh = h.refresh;
      S.programmes = h.programmes; S.leaders = h.leaders; S.recent = h.recent;
      S.view = 'home'; render();
      var q = document.getElementById('q'); if (q) q.focus();
    }).catch(function (e) { toast(errMsg(e), 'err'); }).then(function () { busy(false); });
  }

  function loadProgramme(name, keepState) {
    busy(true, 'Loading ' + name + '…');
    return run('apiProgramme', name).then(function (m) {
      S.prog = m; S.view = 'prog'; S.limit = 50;
      if (!keepState) {
        S.sel = { kpi: 'open', sub: '', type: '' };
        S.f = { ogs: [], leader: S.user.isLeader ? '' : S.homeLeader, supplier: '' };
      }
      if (S.f.leader && m.filters.leaders.indexOf(S.f.leader) === -1) S.f.leader = '';
      render(); window.scrollTo(0, 0);
    }).catch(function (e) { toast(errMsg(e), 'err'); }).then(function () { busy(false); });
  }

  function setSel(sel) {
    S.sel = sel; S.limit = 50;
    refreshProgramme();
  }

  function openSend() {
    var p = S.prog;
    S.send = {
      to: (p.lastTo || []).filter(function (x) { return isMail(x.email); }).map(function (x) { return { name: x.name || '', email: x.email }; }),
      cc: [], subject: '[Programme status] ' + p.name + ' · ' + L.selectionLabel(S.sel) + ' · ' + fmt(today()),
      body: '', bodyTouched: false, saveDrive: true, log: true,
      sugg: { to: [], cc: [] }, html: null, result: null
    };
    S.view = 'send'; render(); window.scrollTo(0, 0);
    var f = document.getElementById('preview');
    if (f) f.srcdoc = '<p style="font:14px Arial;color:#4A5B78;padding:24px">Building the preview…</p>';
    run('apiFicheHtml', p.name, S.f, S.sel).then(function (html) { S.send.html = html; setPreview(html); })
      .catch(function (e) { toast('Preview unavailable: ' + errMsg(e), 'err'); });
  }

  function taken(email) {
    email = email.toLowerCase();
    return email === String(S.user.email).toLowerCase() ||
      S.send.to.concat(S.send.cc).some(function (c) { return c.email.toLowerCase() === email; });
  }

  function addPerson(field, person) {
    if (!person || !isMail(person.email) || taken(person.email)) return;
    S.send[field].push({ name: person.name || '', email: person.email.trim() });
    S.send.sugg[field] = [];
    var input = document.getElementById('in-' + field);
    if (input) { input.value = ''; input.focus(); }
    renderRecip(field); renderSugg(field);
  }

  var searchTimers = {};
  function searchPeople(field, q) {
    clearTimeout(searchTimers[field]);
    if (q.trim().length < 2) { S.send.sugg[field] = []; renderSugg(field); return; }
    searchTimers[field] = setTimeout(function () {
      run('apiSearchPeople', q).then(function (list) {
        var input = document.getElementById('in-' + field);
        if (!input || input.value !== q) return;
        S.send.sugg[field] = (list || []).filter(function (pp) { return !taken(pp.email); });
        renderSugg(field);
      }).catch(function () {
        toast('Directory unavailable: type the full e-mail address, then Enter.', 'err');
      });
    }, 300);
  }

  function doSend() {
    var s = S.send;
    if (!s.to.length || !sendCounts().cases) return;
    var payload = {
      programme: S.prog.name, to: s.to, cc: s.cc,
      subject: document.getElementById('subj').value,
      body: document.getElementById('body').value,
      saveDrive: document.getElementById('opt-drive').checked,
      log: document.getElementById('opt-log').checked,
      filters: S.f, selection: S.sel
    };
    busy(true, 'Building the PDF and sending…');
    run('apiSendFiche', payload).then(function (r) {
      s.result = r; s.subject = payload.subject; s.body = payload.body; s.bodyTouched = true;
      render();
    }).catch(function (e) { toast('Could not send: ' + errMsg(e), 'err'); }).then(function () { busy(false); });
  }

  /* ---------- Events ---------- */
  app.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'open-prog') loadProgramme(el.getAttribute('data-name'));
    else if (act === 'home') loadHome();
    else if (act === 'kpi') {
      var k = el.getAttribute('data-kpi');
      setSel({ kpi: k, sub: '', type: '' });
    }
    else if (act === 'sub') {
      var sub = el.getAttribute('data-sub');
      setSel({ kpi: S.sel.kpi, sub: S.sel.sub === sub ? '' : sub, type: '' });
    }
    else if (act === 'type') {
      var t = el.getAttribute('data-type');
      if (t === L.MISSING_KEY) setSel({ kpi: 'decision', sub: 'MISSING', type: '' });
      else setSel({ kpi: S.sel.kpi, sub: S.sel.sub, type: S.sel.type === t ? '' : t });
    }
    else if (act === 'crumb') {
      var lvl = Number(el.getAttribute('data-level'));
      if (lvl === 0) setSel({ kpi: 'open', sub: '', type: '' });
      else if (lvl === 1) setSel({ kpi: S.sel.kpi, sub: '', type: '' });
      else setSel({ kpi: S.sel.kpi, sub: S.sel.sub, type: '' });
    }
    else if (act === 'more') { S.limit += 50; document.getElementById('cases').innerHTML = caseList(S.prog, current()); }
    else if (act === 'clear-filters') {
      S.f = { ogs: [], leader: '', supplier: '' }; S.limit = 50;
      ['f-leader', 'f-supplier'].forEach(function (id) { var e = document.getElementById(id); if (e) e.value = ''; });
      Array.prototype.forEach.call(document.querySelectorAll('input[name="f-og"]'), function (c) { c.checked = false; });
      refreshProgramme();
    }
    else if (act === 'export') {
      busy(true, 'Creating the export…');
      run('apiExport', S.prog.name, S.f, S.sel)
        .then(function (r) { toast('Export created (' + plural(r.rows, 'row') + ') in the reports Drive folder', '', { url: r.url, label: 'Open' }); })
        .catch(function (e) { toast(errMsg(e), 'err'); }).then(function () { busy(false); });
    }
    else if (act === 'send') openSend();
    else if (act === 'back-prog') { S.view = 'prog'; render(); window.scrollTo(0, 0); }
    else if (act === 'pdf-drive') {
      busy(true, 'Building the PDF…');
      run('apiPdfToDrive', S.prog.name, S.f, S.sel)
        .then(function (r) { toast('PDF saved in Drive', '', { url: r.url, label: 'Open' }); })
        .catch(function (e) { toast(errMsg(e), 'err'); }).then(function () { busy(false); });
    }
    else if (act === 'rm') {
      var f = el.getAttribute('data-field'), em = el.getAttribute('data-email');
      S.send[f] = S.send[f].filter(function (c) { return c.email !== em; });
      renderRecip(f);
    }
    else if (act === 'add') {
      var fld = el.getAttribute('data-field');
      addPerson(fld, S.send.sugg[fld][Number(el.getAttribute('data-idx'))]);
    }
    else if (act === 'do-send') doSend();
    else if (act === 'new-send') { S.send.result = null; render(); }
  });

  app.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'q') { S.homeQuery = t.value; renderTiles(); }
    else if (t.hasAttribute('data-recip')) searchPeople(t.getAttribute('data-recip'), t.value);
    else if (t.id === 'body') { S.send.bodyTouched = true; S.send.body = t.value; }
    else if (t.id === 'subj') S.send.subject = t.value;
  });

  app.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'switch') loadProgramme(t.value, true);
    else if (t.id === 'home-leader') { S.homeLeader = t.value; render(); }
    else if (t.name === 'f-og') {
      S.f.ogs = Array.prototype.map.call(document.querySelectorAll('input[name="f-og"]:checked'), function (c) { return c.value; });
      S.limit = 50; refreshProgramme();
    }
    else if (t.id === 'f-leader') { S.f.leader = t.value; S.limit = 50; refreshProgramme(); }
    else if (t.id === 'f-supplier') { S.f.supplier = t.value; S.limit = 50; refreshProgramme(); }
    else if (t.id === 'opt-drive') S.send.saveDrive = t.checked;
    else if (t.id === 'opt-log') S.send.log = t.checked;
  });

  app.addEventListener('keydown', function (ev) {
    var t = ev.target;
    if (!t.hasAttribute || !t.hasAttribute('data-recip')) return;
    var field = t.getAttribute('data-recip');
    if (ev.key === 'Enter') {
      ev.preventDefault();
      var list = S.send.sugg[field] || [];
      if (list.length) addPerson(field, list[0]);
      else if (isMail(t.value)) addPerson(field, { name: '', email: t.value.trim() });
      else if (t.value.trim()) toast('Invalid e-mail address.', 'err');
    } else if (ev.key === 'Escape') {
      S.send.sugg[field] = []; renderSugg(field);
    } else if (ev.key === 'Backspace' && !t.value && S.send[field].length) {
      S.send[field].pop(); renderRecip(field);
    }
  });

  loadHome();
})();
</script>
